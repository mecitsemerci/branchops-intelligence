# Configuration for the docker compose stack (deploy/docker/compose.yaml).
#
# Model: by default the agents use VLLM_MODEL (Qwen/Qwen2.5-1.5B-Instruct) served by vLLM's OpenAI-compatible
# API in the `vllm` compose service (LLM_MODE=docker, CPU or VLLM_DEVICE=gpu), or by a server on the host
# (LLM_MODE=host, port 8000). LLM_MODE=mock uses the deterministic mock provider.
# All values below can be overridden through environment variables / .env (see .env.example).
app:
  environment: development
  log_level: ${LOG_LEVEL:-INFO}
api: {host: 0.0.0.0, port: 8080}
dashboard: {host: 0.0.0.0, port: 8090}
# Dev auth and no teams: every MCP caller is the dev principal in one unrestricted "dev" team.
mcp: {host: 0.0.0.0, port: 8095}
reporting: {enabled: true}          # MCP report_incident / add_incident_update (source "app")
notifications: {email: {backend: log}, zoom: {backend: log}}   # notifications are logged, not sent
database:
  url: ${DATABASE_URL:-postgresql+psycopg://branchops:branchops@postgres:5432/branchops}
sources:
  - id: jira
    type: jira_webhook
    field_mapping:
      branch_code: ${JIRA_FIELD_BRANCH_CODE:-customfield_10101}
      application: ${JIRA_FIELD_APPLICATION:-customfield_10102}
  - id: csv                       # docker compose run --rm api branchops import --source csv <file>
    type: csv_import
    field_mapping: {summary: Konu, description: Açıklama, branch_code: Sube Kodu, application: Uygulama,
                    status: Durum, priority: Öncelik, reporter: Bildiren, created_at: Oluşturma,
                    updated_at: Güncelleme, group_key: Ekip}
    options: {id_column: Kayıt No}
llm:
  provider: ${LLM_PROVIDER:-openai-compatible}
  base_url: ${LLM_BASE_URL:-http://vllm:8000/v1}
  model: ${LLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}
  api_key_env: LLM_API_KEY
  ca_bundle: ${LLM_CA_BUNDLE:-}
  timeout_seconds: ${LLM_TIMEOUT_SECONDS:-300}
  max_retries: 1
  temperature: 0
  max_output_tokens: 3072
  capabilities:
    structured_outputs: true      # vLLM: response_format json_schema, grammar-constrained (xgrammar)
    json_mode: true
    tool_calling: false
    context_length: 16384         # = vLLM --max-model-len (VLLM_MAX_MODEL_LEN)
    max_output_tokens: 4096
workflow:
  checkpointer: postgres
  node_timeout_seconds: 600
  max_repair_attempts: 1
  max_input_chars: 12000
  # Demo: the agentic investigation step is on. It runs only when the similarity step found related
  # history, calls allow-listed read-only tools and is bounded (defaults kept: 4 tool calls, 3 turns).
  investigation:
    enabled: true
    max_tool_calls: 4
    max_depth: 3
worker:
  concurrency: ${WORKER_CONCURRENCY:-1}   # one local model instance: process one issue at a time
  poll_interval_seconds: 1
  lease_seconds: 300            # renewed every 100 s while a run is alive; a killed run is retried after 5 min
  health_port: 8081
security:
  auth_mode: dev
  dev_user: developer
  dev_roles: [ADMIN]
network:
  # Development hosts: the host machine (LLM_MODE=host) and the in-compose "vllm" service.
  allowed_host_suffixes: [".svc", ".svc.cluster.local", ".internal", ".local", "localhost", "host.docker.internal", "vllm"]
templates: {directory: /app/templates}
