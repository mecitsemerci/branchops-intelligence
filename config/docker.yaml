# Configuration for the docker compose stack (deploy/docker/compose.yaml).
#
# Model: by default the agents use Gemma 3 (branchops-gemma3:4b = gemma3:4b with a 16k context) served by
# Ollama's OpenAI-compatible API — on the host (LLM_MODE=host, GPU/Metal accelerated) or in the
# `ollama` compose service (LLM_MODE=docker). LLM_MODE=mock uses the deterministic mock provider.
# All values below can be overridden through environment variables / .env (see .env.example).
app:
  environment: development
  log_level: ${LOG_LEVEL:-INFO}
api: {host: 0.0.0.0, port: 8080}
dashboard: {host: 0.0.0.0, port: 8090}
database:
  url: ${DATABASE_URL:-postgresql+psycopg://branchops:branchops@postgres:5432/branchops}
jira:
  field_mapping:
    branch_code: ${JIRA_FIELD_BRANCH_CODE:-customfield_10101}
    application: ${JIRA_FIELD_APPLICATION:-customfield_10102}
llm:
  provider: ${LLM_PROVIDER:-openai-compatible}
  base_url: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
  model: ${LLM_MODEL:-branchops-gemma3:4b}
  api_key_env: LLM_API_KEY
  ca_bundle: ${LLM_CA_BUNDLE:-}
  timeout_seconds: ${LLM_TIMEOUT_SECONDS:-300}
  max_retries: 1
  temperature: 0
  max_output_tokens: 3072
  capabilities:
    structured_outputs: true      # Ollama supports response_format json_schema (grammar-constrained)
    json_mode: true
    tool_calling: false
    context_length: 16384
    max_output_tokens: 4096
workflow:
  checkpointer: postgres
  node_timeout_seconds: 600
  max_repair_attempts: 1
  max_input_chars: 12000
worker:
  concurrency: ${WORKER_CONCURRENCY:-1}   # one local model instance: process one issue at a time
  poll_interval_seconds: 1
  lease_seconds: 300            # renewed every 100 s while a run is alive; a killed run is retried after 5 min
  health_port: 8081
security:
  auth_mode: dev
  dev_user: developer
  dev_roles: [ADMIN]
network:
  # Development hosts: the host machine (host Ollama) and the in-compose "ollama" service.
  allowed_host_suffixes: [".svc", ".svc.cluster.local", ".internal", ".local", "localhost", "host.docker.internal", "ollama"]
templates: {directory: /app/templates}
