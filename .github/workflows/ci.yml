# Lint, type check and the full test suite on every push and pull request.  The mock LLM provider is used
# throughout: no model endpoint, no model download, no secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Ruff
        run: |
          ruff check src tests migrations scripts
          ruff format --check src tests migrations scripts
      - name: mypy (strict)
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: branchops
          POSTGRES_PASSWORD: branchops
          POSTGRES_DB: branchops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U branchops -d branchops_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      # The integration suite drops and recreates the public schema of this dedicated database.
      TEST_DATABASE_URL: postgresql+psycopg://branchops:branchops@localhost:5432/branchops_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install
        run: python -m pip install -c requirements-dev.lock -e ".[dev,xlsx]"
      - name: Unit tests
        run: pytest tests/unit -q
      - name: PostgreSQL integration tests
        run: pytest tests/integration -q

  manifests:
    name: OpenShift manifests render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kustomize build
        run: |
          kubectl kustomize deploy/openshift/base > /dev/null
          kubectl kustomize deploy/openshift/overlays/production > /dev/null
