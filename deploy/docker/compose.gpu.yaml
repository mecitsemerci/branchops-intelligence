# Run the `vllm` service on NVIDIA GPUs (Linux host with the NVIDIA Container Toolkit):
#
#   make up VLLM_DEVICE=gpu
#   docker compose -f deploy/docker/compose.yaml -f deploy/docker/compose.gpu.yaml --profile vllm up -d
#
# Same model and flags as the CPU build, minus --enforce-eager (CUDA graphs speed up decoding on GPU).
services:
  vllm:
    image: ${VLLM_GPU_IMAGE:-vllm/vllm-openai:v0.31.0}
    command:
      - ${VLLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=${VLLM_MAX_MODEL_LEN:-16384}
      - --dtype=${VLLM_DTYPE:-bfloat16}
      - --generation-config=vllm
      - --gpu-memory-utilization=${VLLM_GPU_MEMORY_UTILIZATION:-0.85}
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
