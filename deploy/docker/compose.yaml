# Full local stack: PostgreSQL + migrate (one-shot) + API + worker + dashboard + MCP server + simulator
# + vLLM (OpenAI-compatible model server).
#
#   make up                    # model in the `vllm` compose service (CPU image), simulator every 5 min
#   make up VLLM_DEVICE=gpu    # same, CUDA image on an NVIDIA GPU (adds compose.gpu.yaml)
#   make up LLM_MODE=host      # vLLM (or any OpenAI-compatible server) already running on the host :8000
#   make up LLM_MODE=mock      # deterministic mock model, no LLM needed
#   make down
#
# Without make: docker compose -f deploy/docker/compose.yaml --profile vllm up -d --build
#
# Containers run like on OpenShift: arbitrary non-root UID in group 0, read-only root filesystem,
# writable /tmp only, no capabilities. Model settings: config/docker.yaml and .env.example.
name: branchops

x-app: &app
  image: ${IMAGE:-branchops-intelligence:dev}
  user: "1000770000:0"
  read_only: true
  tmpfs:
    - /tmp:uid=1000770000,gid=0,mode=1777
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  env_file:
    - path: ../../.env
      required: false
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &app-env
    BRANCHOPS_CONFIG: /app/config/branchops.yaml
    LLM_PROVIDER: ${LLM_PROVIDER:-openai-compatible}
    LLM_BASE_URL: ${LLM_BASE_URL:-http://vllm:8000/v1}
    LLM_MODEL: ${LLM_MODEL:-${VLLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}}
    JIRA_WEBHOOK_SECRETS: ${JIRA_WEBHOOK_SECRETS:-dev-secret}
    DASHBOARD_STORAGE_SECRET: ${DASHBOARD_STORAGE_SECRET:-local-dev-storage-secret}
  volumes:
    - ../../config/docker.yaml:/app/config/branchops.yaml:ro
  restart: unless-stopped

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_USER: branchops
      POSTGRES_PASSWORD: branchops
      POSTGRES_DB: branchops
    ports: ["${POSTGRES_PORT:-55432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U branchops -d branchops"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-python:3.12-slim}
        WHEELHOUSE_SOURCE: ${WHEELHOUSE_SOURCE:-online}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *app
    command: ["api"]
    ports: ["${API_PORT:-8080}:8080"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *app
    command: ["worker"]
    # Health/metrics on :8081 inside the container (not published so the service can be scaled).
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    stop_grace_period: 60s
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  dashboard:
    <<: *app
    command: ["dashboard"]
    ports: ["${DASHBOARD_PORT:-8090}:8090"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Read-only MCP server for MCP clients (Claude Desktop/Code, Cursor): http://localhost:8095/mcp.
  # Dev auth (config/docker.yaml): every caller is the dev principal; published on loopback only.
  mcp:
    <<: *app
    command: ["mcp"]
    environment:
      <<: *app-env
      FASTMCP_CHECK_FOR_UPDATES: "off"
      FASTMCP_HOME: /tmp/fastmcp
    ports: ["127.0.0.1:${MCP_PORT:-8095}:8095"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Random Turkish branch incidents posted to the API: a short burst at start, then one every
  # SIMULATOR_INTERVAL_SECONDS (default 300 = 5 min), sometimes with follow-up comments.
  simulator:
    <<: *app
    command: ["simulate"]
    environment:
      <<: *app-env
      SIMULATOR_API_URL: http://api:8080
      SIMULATOR_INTERVAL_SECONDS: ${SIMULATOR_INTERVAL_SECONDS:-300}
      SIMULATOR_INITIAL_BURST: ${SIMULATOR_INITIAL_BURST:-2}
      SIMULATOR_FOLLOW_UP_PROBABILITY: ${SIMULATOR_FOLLOW_UP_PROBABILITY:-0.35}
    depends_on:
      api: {condition: service_healthy}

  # Model server (profile "vllm", started by `make up` / `make model`): vLLM's OpenAI-compatible API on
  # http://vllm:8000/v1, published on loopback for `make llm-health` and evaluations from the host.
  # The default image is vLLM's CPU build (amd64 and arm64, so it also runs on Apple silicon, without
  # Metal); compose.gpu.yaml switches to the CUDA image. The first start downloads VLLM_MODEL from
  # Hugging Face into the vllm-cache volume; later starts reuse it.
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai-cpu:v0.31.0}
    profiles: ["vllm"]
    command:
      - ${VLLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=${VLLM_MAX_MODEL_LEN:-16384}   # = llm.capabilities.context_length
      - --dtype=${VLLM_DTYPE:-bfloat16}
      - --generation-config=vllm   # ignore the checkpoint's sampling defaults; the app sends temperature 0
      - --enforce-eager            # CPU: same decode speed as the compiled graph, much faster start
    environment:
      VLLM_CPU_KVCACHE_SPACE: ${VLLM_CPU_KVCACHE_SPACE:-1}   # GiB of KV cache (CPU build only)
      HF_TOKEN: ${HF_TOKEN:-}                               # only for gated models
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}                  # 1: never contact the Hub (model already cached)
    ports: ["127.0.0.1:${VLLM_PORT:-8099}:8000"]
    shm_size: 2gb
    volumes:
      - vllm-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30m   # first start: image + model download and load
    restart: unless-stopped

volumes:
  pgdata:
  vllm-cache:
