apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: branchops
resources:
  - ../../base
images:
  - name: branchops-intelligence
    newName: registry.bank.internal/branchops/branchops-intelligence
    newTag: 0.1.0
patches:
  - target: {kind: Deployment, name: branchops-worker}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  # MCP consumers: the namespaces of the teams allowed to call the MCP server in-cluster (plus the router
  # for desktop clients). Keep in sync with `mcp.teams` in branchops.yaml.
  - target: {kind: NetworkPolicy, name: branchops-mcp-allow-consumers}
    patch: |-
      - op: replace
        path: /spec/ingress/0/from
        value:
          - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: app-support-tools}}
          - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: internal-chatbot}}
          - namespaceSelector: {matchLabels: {policy-group.network.openshift.io/ingress: ""}}
