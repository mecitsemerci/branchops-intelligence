apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: branchops
resources:
  - ../../base
images:
  - name: branchops-intelligence
    newName: registry.bank.internal/branchops/branchops-intelligence
    newTag: 0.1.0
patches:
  - target: {kind: Deployment, name: branchops-worker}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
