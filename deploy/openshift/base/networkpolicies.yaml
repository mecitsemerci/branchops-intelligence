# Default deny; then allow only the flows BranchOps needs. Adjust the namespace labels / CIDRs of the
# bank's shared PostgreSQL, LLM gateway, SSO and observability namespaces in the overlay.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: branchops-default-deny}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: branchops-allow-dns}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: openshift-dns}}
      ports:
        - {protocol: UDP, port: 5353}
        - {protocol: TCP, port: 5353}
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# Router -> API (Jira webhooks + SSO users) and Dashboard.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: branchops-allow-router}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [branchops-api, branchops-dashboard]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {policy-group.network.openshift.io/ingress: ""}}
      ports:
        - {protocol: TCP, port: 8443}
---
# In-cluster Prometheus scraping (/metrics on the API and MCP proxy ports and the worker health port).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: branchops-allow-monitoring}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [branchops-api, branchops-worker, branchops-mcp]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {network.openshift.io/policy-group: monitoring}}
      ports:
        - {protocol: TCP, port: 8443}
        - {protocol: TCP, port: 8081}
---
# All BranchOps pods -> the bank's PostgreSQL service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: branchops-allow-postgres}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [branchops-api, branchops-worker, branchops-dashboard, branchops-mcp, branchops-migrate]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: db-shared}}
        # For a PostgreSQL cluster outside OpenShift use an ipBlock instead, e.g.:
        # - ipBlock: {cidr: 10.40.12.0/24}
      ports:
        - {protocol: TCP, port: 5432}
---
# Only the worker may call the internal LLM inference gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: branchops-allow-llm-gateway}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: branchops-worker}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ai-platform}}
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 8443}
---
# oauth2-proxy sidecars -> bank SSO (OIDC). Traces -> internal OTel collector (optional).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: branchops-allow-sso-and-otel}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [branchops-api, branchops-dashboard, branchops-worker, branchops-mcp]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: sso}}
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 8443}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: observability}}
      ports:
        - {protocol: TCP, port: 4318}
---
# Worker -> notification and ticketing endpoints: internal SMTP relay, Zoom egress proxy, internal Jira.
# Adjust the namespace labels / ipBlocks to the bank's mail relay, egress proxy and Jira in the overlay.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: branchops-allow-delivery}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: branchops-worker}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: mail-relay}}
      ports:
        - {protocol: TCP, port: 587}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: egress-proxy}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: jira}}
      ports:
        - {protocol: TCP, port: 443}
---
# Attachment store (only with attachments.store: s3): processes that read or write attachments.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: branchops-allow-object-store}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [branchops-api, branchops-worker, branchops-dashboard, branchops-mcp]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: object-storage}}
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 9000}
