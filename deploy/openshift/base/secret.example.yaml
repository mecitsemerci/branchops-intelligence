# NOT applied by kustomize. Create the real secrets from the bank's secret store (Vault / Sealed Secrets).
apiVersion: v1
kind: Secret
metadata: {name: branchops-secrets}
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://branchops:CHANGE_ME@postgres.db-shared.svc.cluster.local:5432/branchops
  LLM_BASE_URL: https://llm-gateway.ai-platform.svc.cluster.local/v1
  LLM_API_KEY: CHANGE_ME
  JIRA_WEBHOOK_SECRETS: CHANGE_ME_CURRENT,CHANGE_ME_PREVIOUS
  DASHBOARD_STORAGE_SECRET: CHANGE_ME_RANDOM_32_BYTES
  # In-app reporting: HMAC key pseudonymising host-app usernames in app_context (required in production).
  BRANCHOPS_PSEUDONYM_KEY: CHANGE_ME_RANDOM_32_BYTES
  # Notifications: SMTP relay credentials (if the relay requires AUTH) and one Zoom webhook token per team
  # (the variable name is the team's zoom_webhook_secret_ref in the dashboard).
  SMTP_USERNAME: branchops
  SMTP_PASSWORD: CHANGE_ME
  ZOOM_BRANCH_OPS: CHANGE_ME_VERIFICATION_TOKEN
  # Optional: ticket creation for reported incidents, S3-compatible attachment store.
  TICKETING_JIRA_TOKEN: CHANGE_ME
  ATTACHMENTS_S3_ACCESS_KEY: CHANGE_ME
  ATTACHMENTS_S3_SECRET_KEY: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata: {name: oauth2-proxy-secrets}
type: Opaque
stringData:
  OAUTH2_PROXY_CLIENT_ID: branchops
  OAUTH2_PROXY_CLIENT_SECRET: CHANGE_ME
  OAUTH2_PROXY_COOKIE_SECRET: CHANGE_ME_32_BYTES_BASE64
