# Applies Alembic migrations, creates LangGraph checkpoint tables and publishes templates (immutable).
# Run once per release before rolling out the Deployments (e.g. as an Argo CD PreSync hook).
apiVersion: batch/v1
kind: Job
metadata:
  name: branchops-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/name: branchops-migrate, app.kubernetes.io/component: migrate}
    spec:
      serviceAccountName: branchops-worker
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migrate
          image: branchops-intelligence
          args: ["migrate"]
          envFrom:
            - secretRef: {name: branchops-secrets}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /app/config, readOnly: true}
            - {name: ca-bundle, mountPath: /etc/pki/bank, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: branchops-config}}
        - {name: ca-bundle, configMap: {name: bank-ca-bundle, items: [{key: ca-bundle.crt, path: ca-bundle.crt}]}}
        - {name: tmp, emptyDir: {}}
