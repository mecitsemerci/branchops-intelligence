# Dashboard: NiceGUI bound to 127.0.0.1:8090 behind oauth2-proxy (all assets served locally).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: branchops-dashboard
  labels: {app.kubernetes.io/name: branchops-dashboard, app.kubernetes.io/component: dashboard}
spec:
  # NiceGUI keeps per-client UI state in memory; scale out only with Route session affinity (default on).
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: branchops-dashboard}
  template:
    metadata:
      labels: {app.kubernetes.io/name: branchops-dashboard, app.kubernetes.io/component: dashboard}
    spec:
      serviceAccountName: branchops-dashboard
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      # The preStop sleep lets the router and Service endpoints drop the pod before the app stops accepting
      # connections; the grace period covers it plus in-flight requests.
      terminationGracePeriodSeconds: 45
      containers:
        - name: dashboard
          lifecycle:
            preStop:
              exec: {command: ["sleep", "5"]}
          image: branchops-intelligence
          args: ["dashboard"]
          envFrom:
            - secretRef: {name: branchops-secrets}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /app/config, readOnly: true}
            - {name: ca-bundle, mountPath: /etc/pki/bank, readOnly: true}
            - {name: tmp, mountPath: /tmp}
        - name: oauth2-proxy
          image: oauth2-proxy
          args:
            - --http-address=
            - --https-address=0.0.0.0:8443
            - --tls-cert-file=/etc/tls/private/tls.crt
            - --tls-key-file=/etc/tls/private/tls.key
            - --upstream=http://127.0.0.1:8090/
            - --redirect-url=https://branchops.apps.bank.internal/oauth2/callback
            - --skip-auth-route=GET=^/health/
          envFrom:
            - configMapRef: {name: oauth2-proxy-config}
            - secretRef: {name: oauth2-proxy-secrets}
          ports:
            - {name: https, containerPort: 8443}
          readinessProbe:
            httpGet: {path: /health/ready, port: 8443, scheme: HTTPS}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: 8443, scheme: HTTPS}
            periodSeconds: 20
          startupProbe:
            httpGet: {path: /health/live, port: 8443, scheme: HTTPS}
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: proxy-tls, mountPath: /etc/tls/private, readOnly: true}
            - {name: ca-bundle, mountPath: /etc/pki/bank, readOnly: true}
      volumes:
        - {name: config, configMap: {name: branchops-config}}
        - {name: ca-bundle, configMap: {name: bank-ca-bundle, items: [{key: ca-bundle.crt, path: ca-bundle.crt}]}}
        - {name: tmp, emptyDir: {sizeLimit: 256Mi}}
        - {name: proxy-tls, secret: {secretName: branchops-dashboard-tls}}
---
apiVersion: v1
kind: Service
metadata:
  name: branchops-dashboard
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: branchops-dashboard-tls
  labels: {app.kubernetes.io/name: branchops-dashboard}
spec:
  selector: {app.kubernetes.io/name: branchops-dashboard}
  ports:
    - {name: https, port: 443, targetPort: 8443}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: branchops-dashboard
  annotations:
    haproxy.router.openshift.io/hsts_header: max-age=31536000
    haproxy.router.openshift.io/timeout: 1h   # long-lived websocket connections
spec:
  host: branchops.apps.bank.internal
  to: {kind: Service, name: branchops-dashboard}
  port: {targetPort: https}
  tls: {termination: reencrypt, insecureEdgeTerminationPolicy: Redirect}
