# BranchOps Intelligence configuration (production example).
# ${VAR} is replaced from the environment at startup; ${VAR:-default} supplies a default.
# Secrets are never written here: only the NAMES of environment variables populated from OpenShift Secrets.

app:
  environment: production          # development | test | production (production enables safety guards)
  log_level: INFO
  service_name: branchops-intelligence

api:
  host: 127.0.0.1                  # loopback: only the oauth-proxy sidecar / Route via proxy reaches the app
  port: 8080

database:
  url: ${DATABASE_URL}             # postgresql+psycopg://user:pass@host:5432/branchops
  pool_size: 5
  max_overflow: 5
  statement_timeout_ms: 30000
  sslmode: ${DATABASE_SSLMODE:-verify-full}
  sslrootcert: ${DATABASE_SSLROOTCERT:-/etc/pki/bank/ca-bundle.crt}

webhook:
  max_body_bytes: 1048576          # request size limit for every push source

# Incident sources. Each enabled push source accepts POST /api/ingest/<id> (Jira also keeps the legacy
# URL /api/webhooks/jira); pull sources are read by `branchops poll` / `branchops import`.
# Without a `sources` list, the legacy `jira:` + `webhook:` sections are translated into one Jira source.
sources:
  - id: jira
    type: jira_webhook
    enabled: true
    auth:
      mode: hmac_or_token            # hmac | token | hmac_or_token
      secrets_env: JIRA_WEBHOOK_SECRETS   # comma-separated, supports rotation
      token_header: X-BranchOps-Webhook-Token
      allow_query_token: false       # enable only for legacy Jira that cannot send headers
      query_token_secrets_env: JIRA_WEBHOOK_QUERY_TOKENS
      allowed_source_cidrs: []       # e.g. ["10.20.0.0/16"] — Jira node addresses
    allowed_groups: []               # Jira project keys; empty = all projects that send webhooks
    field_mapping:                   # canonical field -> Jira custom field id
      branch_code: ${JIRA_FIELD_BRANCH_CODE:-customfield_10101}
      application: ${JIRA_FIELD_APPLICATION:-customfield_10102}
  - id: snow                         # reference adapter: adapt to the bank's Business Rule payload
    type: servicenow_webhook
    enabled: false
    auth:
      mode: token
      secrets_env: SERVICENOW_WEBHOOK_SECRETS
      token_header: X-BranchOps-Webhook-Token
    allowed_groups: []               # assignment group names
    field_mapping: {branch_code: u_branch_code, application: cmdb_ci}
  - id: csv
    type: csv_import
    enabled: false
    poll_interval_seconds: 300       # `branchops poll` scans options.watch_directory
    field_mapping:
      summary: Konu
      description: Açıklama
      branch_code: Sube Kodu
      application: Uygulama
      status: Durum
      priority: Öncelik
      reporter: Bildiren
      created_at: Oluşturma
      updated_at: Güncelleme
      group_key: Ekip
    options:
      id_column: Kayıt No            # stable external key; without it rows are keyed by content hash
      watch_directory: /data/imports
      timezone: Europe/Istanbul

# Screen ownership registry (teams/applications/screens/rules are data, managed in the dashboard /yonetim).
ownership:
  branch_ops_team_key: branch-ops   # CC on every routed notification, fallback owner
  platform_team_key: platform       # receives ownership_unresolved together with branch-ops

# Notifications of routed (in-app reported) incidents; drained by the worker from notification_outbox.
notifications:
  enabled: true
  email:
    backend: smtp                  # smtp | log | null
    smtp_host: smtp-relay.bank.internal
    smtp_port: 587
    starttls: true
    ca_bundle: /etc/pki/bank/ca-bundle.crt
    username_env: SMTP_USERNAME
    password_env: SMTP_PASSWORD
    from_address: branchops@bank.internal
    from_name: BranchOps
  zoom:
    backend: webhook               # webhook | log | null
    # Bank egress proxy in front of Zoom incoming webhooks: <base>/<team.zoom_channel_id>?format=full
    webhook_base_url: ${ZOOM_WEBHOOK_BASE_URL:-https://zoom-egress.bank.internal/chat/webhooks/incomingwebhook}
    ca_bundle: /etc/pki/bank/ca-bundle.crt

# Incident reporting through MCP (report_incident / add_incident_update); adds an `mcp_report` source "app".
reporting:
  enabled: true
  source_id: app
  key_prefix: RPT
  default_group_key: IN-APP

# Screenshots / logs attached to in-app reports (never sent to the LLM; purged after retention.attachments_days).
attachments:
  max_bytes: 3145728               # 3 MB per file (after decoding); images are re-encoded, metadata removed
  allowed_types: [image/png, image/jpeg, text/plain]
  max_per_incident: 5
  store: postgres                  # postgres (bytea in table attachments) | s3 (internal MinIO / Ceph)
  s3:
    endpoint: ${ATTACHMENTS_S3_ENDPOINT:-}   # e.g. https://minio.storage.svc:9000 (outbound URL guard applies)
    bucket: branchops-attachments
    access_key_env: ATTACHMENTS_S3_ACCESS_KEY
    secret_key_env: ATTACHMENTS_S3_SECRET_KEY
  draft_token_ttl_minutes: 30
  forward_to_ticketing: true

# Optional: open tickets for reported incidents (drained by the worker from ticketing_outbox).
ticketing:
  sink: none                       # none | jira
  base_url: ${TICKETING_JIRA_URL:-}  # internal Jira, e.g. https://jira.bank.internal
  token_env: TICKETING_JIRA_TOKEN
  default_project_key: ${TICKETING_PROJECT:-}
  issue_type: Incident
  labels: [branchops-reported]     # exclude from the jira source to avoid re-ingesting the tickets

retention:
  on_issue_deleted: soft_delete    # soft_delete | purge
  redact_deleted_comments: true
  redact_inbox_payload_after_processing: true   # also applies to dead letters
  attachments_days: 180
  inbox_days: 30                   # finished inbox events (and their workflow checkpoints)
  inbox_dead_letter_days: 90       # dead letters stay inspectable / replayable this long

worker:
  concurrency: 2
  batch_size: 4
  poll_interval_seconds: 2
  lease_seconds: 600
  max_attempts: 5
  backoff_base_seconds: 15
  backoff_max_seconds: 1800
  health_port: 8081
  shutdown_grace_seconds: 60

llm:
  provider: openai-compatible
  base_url: ${LLM_BASE_URL}        # e.g. https://llm-gateway.ai-platform.svc.cluster.local/v1
  model: ${LLM_MODEL:-GLM-5.3-Flash}
  api_key_env: LLM_API_KEY
  timeout_seconds: 120
  max_retries: 2
  temperature: 0
  max_output_tokens: 2048
  ca_bundle: ${LLM_CA_BUNDLE:-/etc/pki/bank/ca-bundle.crt}
  capability_detection: explicit  # explicit | probe
  capabilities:
    tool_calling: false
    structured_outputs: ${LLM_CAP_JSON_SCHEMA:-false}
    json_mode: ${LLM_CAP_JSON_OBJECT:-true}
    reasoning_parameters: false
    context_length: 32768
    max_output_tokens: 4096
  reasoning_effort: null
  extra_body: {}

workflow:
  checkpointer: postgres           # postgres | memory | none
  node_timeout_seconds: 300
  max_repair_attempts: 1
  max_input_chars: 24000
  prompt_version: "2026.10-3"
  similarity:
    candidate_limit: 20
    lookback_days: 180
    min_text_rank: 0.01
    verify_top_n: 5
    duplicate_window_hours: 72
    recurring_window_days: 30
    recurring_threshold: 3

templates:
  directory: /app/templates

scoring:
  # Released versions are registered in src/branchops/scoring/policies.py (POLICY_HISTORY); a registered
  # version always scores with its registered parameters. 2026.10-2 adds the non-specific text cap.
  version: "2026.10-2"
  sufficient_completeness_credit: 1.0
  insufficient_completeness_credit: 1.0
  unknown_completeness_handling: CREDIT
  unknown_completeness_credit: 0.0
  level_credits: {ABSENT: 0.0, POOR: 0.25, ACCEPTABLE: 0.6, GOOD: 1.0}
  unknown_quality_handling: CREDIT
  unknown_quality_credit: 0.0
  low_quality_threshold: 50
  specificity_fields: [summary, description]
  non_specific_level_cap: POOR

security:
  auth_mode: oauth_proxy
  trusted_proxy_hosts: ["127.0.0.1", "::1"]
  user_header: X-Forwarded-User
  groups_header: X-Forwarded-Groups
  role_groups:
    ADMIN: [branchops-admins]
    ANALYST: [branchops-analysts]
    VIEWER: [branchops-viewers]
  masking_extra_patterns: []       # e.g. [["MUSTERI_NO", "\\bMN\\d{8}\\b"]]

network:
  allowed_host_suffixes: [".svc", ".svc.cluster.local", ".bank.internal"]
  allow_private_ips: true

observability:
  otlp_endpoint: ${OTLP_ENDPOINT:-}   # internal collector only, e.g. http://otel-collector.observability.svc:4318/v1/traces
  metrics_enabled: true
  trace_sample_ratio: 0.2

dashboard:
  host: 127.0.0.1
  port: 8090
  title: BranchOps Intelligence
  storage_secret_env: DASHBOARD_STORAGE_SECRET

# Read-only MCP server (`branchops mcp`, docs/mcp-server.md). Callers authenticate through the oauth2-proxy
# sidecar like dashboard users; their IdP groups select a team. A team's `role` applies in the MCP server
# only (default VIEWER; request_reanalysis needs ANALYST, get_inbox_health ADMIN or ops_access) - never add
# team groups to security.role_groups, that would open the unscoped API/dashboard to them.
# "*" = unrestricted. Scopes are enforced in SQL.
mcp:
  host: 127.0.0.1
  port: 8095
  max_page_size: 50
  max_text_chars: 4000             # longer description/comment text is truncated (and marked) in tool output
  rate_limit_per_minute: 120       # per principal and replica
  teams:
    - id: branch-ops
      groups: [branchops-branch-ops]
      sources: ["*"]
      group_keys: ["*"]
      branch_codes: ["*"]
      fields: full                 # full | masked (masked: PII masking re-applied, comment authors hidden)
      tools: ["*"]
      role: ANALYST                # MCP-only role of the team's members (default VIEWER)
    - id: app-support
      groups: [branchops-app-support]
      sources: [jira, snow]
      group_keys: [OPS, APP]
      branch_codes: ["*"]
      fields: masked
      tools: [search_incidents, get_incident, get_incident_analysis, find_similar_incidents,
              list_recurring_errors, get_template, list_templates]
    - id: audit
      groups: [branchops-audit]
      sources: ["*"]
      group_keys: ["*"]
      branch_codes: ["*"]
      fields: full
      tools: ["*"]
      ops_access: true             # get_inbox_health without the ADMIN role
